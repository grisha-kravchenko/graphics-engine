<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mineplex Game!</title>
    <script src="vectors.js" type="module"></script>
    <!-- <script src="graphicsMath.js"></script> -->
    <!-- <script src="code.js"></script> -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- <script src="graphics.js" type="module"></script> -->
    <style>
        #MainCanvas {
            overflow-y: scroll;
            overflow-x: scroll;
            padding: 0;
            margin: auto;
            display: block;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
    </style>
</head>
<body>
    <canvas id="MainCanvas"></canvas>
    <script type="module">
        import { exports as graphics } from "./graphics.js";
        document.addEventListener("DOMContentLoaded", () => {
            console.log(graphics)
            graphics.Load();
            graphics.Tick(100);
        });
    </script>
</body>
</html>
